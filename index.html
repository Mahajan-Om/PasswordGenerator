<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PasswordGenerator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100;200;300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">

        <h1>Password Generator</h1>

        <!-- display Container -->
        <div class="display-container">

            <input readonly placeholder="Password" class="display" data-passwordDisplay >
            
            <button class="copyBtn" data-copy>

                <span class="tooltip" data-copyMSG></span>
                <img src="./assets/copy.svg" alt="copy" width="23" height="23" >
            </button>

        </div>

        <!-- input container  -->

        <div class="input-container">

             <!-- length container -->
             <div class="length-container">
                <p>Password Length</p>
                <p data-lengthNumber>0</p>  <!-- starting me zro dal diya isko change krenge slider se to js me isko fetch krne liye elememtsbyid class ka use karenge ya phir custome attribute ka use karenge  -->
            </div>

            <div>   
                <!-- slider -->
                <input type="range" min="1" max="20" class="slider" step="1" data-lengthSlider > <!-- step ki value se slider bhadega jese jese slider move karenge upr value chage hogi isko fetch krne ke liye custome attribute diya  -->

                <!-- checkboxes -->
                
                <div class="check">
                <input type="checkbox"  id="uppercase">
                <label for="uppercase">Includes Uppercase letters</label>
                </div>
                
            <div class="check">
                <input type="checkbox"  id="lowercase">
                <label for="lowercase">Includes Lowercase letters</label>
            </div>
                
            <div class="check">
                <input type="checkbox"  id="numbers">
                <label for="numbers">Includes Numbers </label>
            </div>
                
            <div class="check">
                <input type="checkbox"  id="symbols">
                <label for="symbols">Includes Symbols </label>
            </div>

                <!-- Strength Section -->
            <div class="strength-container">
                    <p>Strength</p>
                    <div class="indicator" data-indicator></div>
            </div>
                    
            <button class="generatorButton"> Password Generator</button>  
        </div> 

             
    </div>


    

    <script src="script.js"></script>
</body>
</html>
